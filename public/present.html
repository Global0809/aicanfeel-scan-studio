<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080c0d">
  <title>AICANFEEL — Scan Studio Presentation</title>
  <meta name="description" content="AICANFEEL Scan Studio's 4K60 performer study, from optical capture and UV calibration to brushed titanium and motion analysis.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AICANFEEL — Scan Studio Presentation">
  <meta property="og:description" content="Watch the 38-second performer study in 4K60. Seven material views share one continuously rotating digital double.">
  <meta property="og:image" content="https://global0809.github.io/aicanfeel-scan-studio/brand/studio-preview.jpg">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta property="og:image:alt" content="The AICANFEEL scan workstation showing the performer, calibrated cameras, tracking graphs and pass sequence.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="./brand/icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050708;color:#dce6e2}
    body{display:grid;place-items:center;font:13px Consolas,monospace}
    main{position:relative;width:min(100vw,177.77778vh);aspect-ratio:16/9}
    video{display:block;width:100%;height:100%;object-fit:contain}
    nav{position:absolute;right:1.5%;bottom:3.5%;display:flex;align-items:center;gap:2px;padding:3px;border:1px solid #647570;border-radius:4px;background:#111a1ef5;box-shadow:0 4px 24px #0307087a;opacity:0;pointer-events:none;transition:opacity .15s}
    main.tools nav,nav:focus-within,main.paused nav{opacity:1;pointer-events:auto}
    a,button{font:inherit;letter-spacing:.035em;text-transform:uppercase;color:inherit;background:transparent;border:0;padding:7px 11px;text-decoration:none;cursor:pointer}
    a:hover,button:hover{color:#c1ffdd}main:not(.tools):not(.paused){cursor:none}
    #issue{position:absolute;bottom:12%;right:2%;padding:8px;background:#101819}
    @media(prefers-reduced-motion:reduce){nav{transition:none}}
  </style>
</head>
<body>
  <main aria-label="Scan Studio presentation">
    <video muted loop playsinline disablepictureinpicture preload="auto" poster="./brand/studio-preview.jpg" aria-label="AICANFEEL performer capture and digital-double inspection"></video>
    <nav aria-label="Presentation controls"><a href="./">Live editor</a><button id="play">Pause</button><button id="full">Full screen</button></nav>
    <span id="issue" role="status" hidden></span>
  </main>
  <script defer src="./presentation.js"></script>
</body>
</html>
